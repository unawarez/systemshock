name: Main Build
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:

  # Build check only. Shipping a bare binary that touches graphics in any way
  # is pretty likely to break outside of the distro it was built on.
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: lukka/get-cmake@latest
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libopengl-dev xorg-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Smoketest
        run: build/systemshock -h

  # Build check only for now. Could in theory distribute an app bundle.
  macos:
    name: macOS
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Smoketest
        run: build/systemshock -h

  # Windows build uses MSYS because the code is (probably(?)) not
  # MSVC-compatible.
  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: gcc:p cmake:p ninja:p
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Install
        run: cmake --install build --prefix dist
      - name: Smoketest
        run: dist/systemshock.exe
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: systemshock-windows-x86-64
          path: dist/
          if-no-files-found: error
